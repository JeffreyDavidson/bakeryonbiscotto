name: Back-merge main to develop

on:
  push:
    branches: [main]

concurrency:
  group: back-merge-main-to-develop
  cancel-in-progress: false

jobs:
  back-merge:
    name: Merge main into develop
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check whether main is already merged
        id: merge-check
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already in develop; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward develop to main
        if: steps.merge-check.outputs.skip == 'false'
        run: git merge --ff-only origin/main

      - name: Push develop
        if: steps.merge-check.outputs.skip == 'false'
        run: git push origin develop
